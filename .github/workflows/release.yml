name: Release

# A `v*` tag releases that exact workspace version: archives, a signed index.json, and provenance.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  check-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Tag matches the workspace version
        run: |
          version="$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "pi-rust-ext") | .version')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match workspace version $version"
            exit 1
          fi
      - name: Fetch the published pi host
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch-ci-pi.py --dest "$RUNNER_TEMP/pi-host"
        timeout-minutes: 10
      - name: Test workspace before release builds
        timeout-minutes: 40
        env:
          PI_REQUIRE_E2E: "1"
        run: cargo test --workspace --locked

  build:
    needs: check-tag
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
      - name: Install cargo-zigbuild
        if: matrix.zig
        timeout-minutes: 10
        run: |
          cargo install --locked cargo-zigbuild --version 0.24.0
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet ziglang==0.15.2
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      - name: Build
        timeout-minutes: 35
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ZIG: ${{ matrix.zig }}
        run: |
          if [ "$ZIG" = true ]; then
            cargo zigbuild --release --locked -p pi-rust-ext --target "$TARGET"
          else
            cargo build --release --locked -p pi-rust-ext --target "$TARGET"
          fi
      # Archive root: the binary (pi-rust-ext or pi-rust-ext.exe), LICENSE, and README.md.
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p stage dist
          cp README.md LICENSE stage/
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/$TARGET/release/pi-rust-ext.exe" stage/
            (cd stage && 7z a -tzip -bso0 "../dist/pi-rust-ext-$TARGET.zip" pi-rust-ext.exe LICENSE README.md)
          else
            cp "target/$TARGET/release/pi-rust-ext" stage/
            chmod 755 stage/pi-rust-ext
            tar -C stage -czf "dist/pi-rust-ext-$TARGET.tar.gz" pi-rust-ext LICENSE README.md
          fi
          rm -rf stage
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  index:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- pi-rust-ext-* > SHA256SUMS && cat SHA256SUMS
      - name: Generate index.json
        timeout-minutes: 10
        run: cargo run --release --locked -p marketplace-index -- marketplace.json "$TAG" dist dist/index.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketplace-index
          path: dist/index.json
          if-no-files-found: error

  sign:
    needs: index
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: marketplace-index
          path: ${{ runner.temp }}/marketplace-index
      - name: Sign index.json
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        working-directory: ${{ runner.temp }}/marketplace-index
        env:
          MARKETPLACE_SIGNING_KEY: ${{ secrets.MARKETPLACE_SIGNING_KEY }}
        run: |
          [ -n "$MARKETPLACE_SIGNING_KEY" ] || { echo "::error::MARKETPLACE_SIGNING_KEY is not set"; exit 1; }
          umask 077
          {
            printf '\x30\x2a\x30\x05\x06\x03\x2b\x65\x70\x03\x21\x00'
            printf '%s' 'G33uzqR2bwGJyZD3qnY4BNThlZzwyntF+DWRTMQYBBo=' | /usr/bin/base64 --decode
          } > "$RUNNER_TEMP/marketplace-public.der"
          /usr/bin/openssl pkeyutl -sign -rawin \
            -inkey <(printf '%s\n' "$MARKETPLACE_SIGNING_KEY") -in index.json \
            -out "$RUNNER_TEMP/marketplace-index.sig"
          /usr/bin/openssl pkeyutl -verify -pubin -keyform DER \
            -inkey "$RUNNER_TEMP/marketplace-public.der" -rawin -in index.json \
            -sigfile "$RUNNER_TEMP/marketplace-index.sig"
          /usr/bin/base64 -w0 "$RUNNER_TEMP/marketplace-index.sig" > index.json.sig
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketplace-signature
          path: ${{ runner.temp }}/marketplace-index/index.json.sig
          if-no-files-found: error

  publish:
    needs: [build, index, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: marketplace-index
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: marketplace-signature
          path: dist
      - name: Verify index signature and archives
        run: bash scripts/verify-release.sh "$TAG" dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/pi-rust-ext-*
            dist/index.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--verify-tag --title "$TAG" --generate-notes)
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "${flags[@]}" dist/pi-rust-ext-* dist/index.json dist/index.json.sig
