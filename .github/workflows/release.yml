name: Release

# Releases run after CI passes on main: conventional commits since the last tag decide the
# next version (`cargo xtask plan`), as in pi-rust. Pushing a `v*` tag releases that exact version.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto reads conventional commits)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: Build every target without tagging or publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.mode.outputs.publish }}
      ref: ${{ steps.commit.outputs.ref || steps.mode.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Plan version
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BUMP: ${{ inputs.bump || 'auto' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            cargo xtask check-tag "$REF_NAME"
            version="${REF_NAME#v}"
            prerelease=false
            case "$version" in *-*) prerelease=true ;; esac
            printf 'release=true\nversion=%s\ntag=%s\nprerelease=%s\n' "$version" "$REF_NAME" "$prerelease" >> "$GITHUB_OUTPUT"
          else
            cargo xtask plan --bump "$BUMP" --github-output
          fi
      - name: Decide whether to publish
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
          RELEASE: ${{ steps.plan.outputs.release }}
        run: |
          publish=false
          case "$EVENT" in
            push) publish=true ;;
            workflow_run) publish="$RELEASE" ;;
            workflow_dispatch) [ "$DRY_RUN" = false ] && [ "$REF" = refs/heads/main ] && publish="$RELEASE" ;;
          esac
          if [ "$publish" = true ] && [ "$EVENT" != push ]; then
            git fetch --quiet origin main
            if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
              echo "main moved past $(git rev-parse --short HEAD); the next CI run on main releases it."
              publish=false
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # A push with GITHUB_TOKEN starts no other workflow, so this run builds and publishes the tag itself.
      - name: Commit version and tag
        id: commit
        if: steps.mode.outputs.publish == 'true' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cargo xtask prepare "$VERSION"
          git add Cargo.toml Cargo.lock marketplace.json CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/main "refs/tags/v$VERSION"
          echo "ref=v$VERSION" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Fetch the published pi host
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch-ci-pi.py --dest "$RUNNER_TEMP/pi-host"
        timeout-minutes: 10
      - name: Test workspace before release builds
        timeout-minutes: 40
        env:
          PI_REQUIRE_E2E: "1"
        run: cargo test --workspace --locked

  build:
    needs: [plan, test]
    if: needs.plan.outputs.release == 'true'
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Install Rust
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
      - name: Install cargo-zigbuild
        if: matrix.zig
        timeout-minutes: 10
        run: |
          cargo install --locked cargo-zigbuild --version 0.24.0
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet ziglang==0.15.2
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      - name: Build
        timeout-minutes: 35
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ZIG: ${{ matrix.zig }}
        run: |
          if [ "$ZIG" = true ]; then
            cargo zigbuild --release --locked -p pi-rust-ext --target "$TARGET"
          else
            cargo build --release --locked -p pi-rust-ext --target "$TARGET"
          fi
      # Archive root: the binary (pi-rust-ext or pi-rust-ext.exe), LICENSE, and README.md.
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p stage dist
          cp README.md LICENSE stage/
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/$TARGET/release/pi-rust-ext.exe" stage/
            (cd stage && 7z a -tzip -bso0 "../dist/pi-rust-ext-$TARGET.zip" pi-rust-ext.exe LICENSE README.md)
          else
            cp "target/$TARGET/release/pi-rust-ext" stage/
            chmod 755 stage/pi-rust-ext
            tar -C stage -czf "dist/pi-rust-ext-$TARGET.tar.gz" pi-rust-ext LICENSE README.md
          fi
          rm -rf stage
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  index:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- pi-rust-ext-* > SHA256SUMS && cat SHA256SUMS
      # A run that does not publish builds the checked-out workspace version.
      - name: Generate index.json
        timeout-minutes: 10
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
        run: |
          if [ "$PUBLISH" != true ]; then
            TAG="v$(cargo metadata --no-deps --locked --format-version 1 \
              | jq -r '.packages[] | select(.name == "pi-rust-ext") | .version')"
          fi
          cargo run --release --locked -p marketplace-index -- marketplace.json "$TAG" dist dist/index.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketplace-index
          path: dist/index.json
          if-no-files-found: error

  sign:
    needs: [plan, index]
    if: needs.plan.outputs.publish == 'true'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: marketplace-index
          path: ${{ runner.temp }}/marketplace-index
      - name: Sign index.json
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        working-directory: ${{ runner.temp }}/marketplace-index
        env:
          MARKETPLACE_SIGNING_KEY: ${{ secrets.MARKETPLACE_SIGNING_KEY }}
        run: |
          [ -n "$MARKETPLACE_SIGNING_KEY" ] || { echo "::error::MARKETPLACE_SIGNING_KEY is not set"; exit 1; }
          umask 077
          {
            printf '\x30\x2a\x30\x05\x06\x03\x2b\x65\x70\x03\x21\x00'
            printf '%s' 'G33uzqR2bwGJyZD3qnY4BNThlZzwyntF+DWRTMQYBBo=' | /usr/bin/base64 --decode
          } > "$RUNNER_TEMP/marketplace-public.der"
          /usr/bin/openssl pkeyutl -sign -rawin \
            -inkey <(printf '%s\n' "$MARKETPLACE_SIGNING_KEY") -in index.json \
            -out "$RUNNER_TEMP/marketplace-index.sig"
          /usr/bin/openssl pkeyutl -verify -pubin -keyform DER \
            -inkey "$RUNNER_TEMP/marketplace-public.der" -rawin -in index.json \
            -sigfile "$RUNNER_TEMP/marketplace-index.sig"
          /usr/bin/base64 -w0 "$RUNNER_TEMP/marketplace-index.sig" > index.json.sig
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketplace-signature
          path: ${{ runner.temp }}/marketplace-index/index.json.sig
          if-no-files-found: error

  publish:
    needs: [plan, build, index, sign]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: marketplace-index
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: marketplace-signature
          path: dist
      - name: Verify index signature and archives
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: bash scripts/verify-release.sh "$TAG" dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/pi-rust-ext-*
            dist/index.json
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # Notes come from CHANGELOG.md; a release made from a hand-pushed tag without a section gets generated notes.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          flags=(--verify-tag --title "$TAG")
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          if cargo xtask notes "$VERSION" > notes.md; then
            flags+=(--notes-file notes.md)
          else
            flags+=(--generate-notes)
          fi
          files=(dist/pi-rust-ext-* dist/index.json dist/index.json.sig)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${flags[@]}" "${files[@]}"
          fi
